name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Used only by the aarch64 Linux target; harmless everywhere else.
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

jobs:
  # Portable archives: one per supported OS/architecture, plus a fully static
  # musl build for distros whose glibc is older than the runner's.
  archives:
    name: archive (${{ matrix.target }})
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross_gnu: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            static: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Install aarch64 cross toolchain
        if: matrix.cross_gnu
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Install musl toolchain
        if: matrix.static
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify musl binary is fully static
        if: matrix.static
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/termshot"
          info="$(file -b "$bin")"
          echo "file: $info"
          case "$info" in
            *"statically linked"* | *"static-pie linked"*) ;;
            *) echo "::error::musl build is not static: $info"; exit 1 ;;
          esac
          # `ldd` exits non-zero on a static binary on some systems, so read
          # its text rather than its status.
          deps="$(ldd "$bin" 2>&1 || true)"
          echo "ldd: $deps"
          case "$deps" in
            *"statically linked"* | *"not a dynamic executable"*) ;;
            *) echo "::error::musl build has dynamic dependencies: $deps"; exit 1 ;;
          esac

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME:-dev}"
          artifact="termshot-${version}-${{ matrix.target }}"
          mkdir -p "$artifact"
          cp "target/${{ matrix.target }}/release/termshot" "$artifact/"
          cp README.md LICENSE termshot.example.toml "$artifact/"
          cp THIRD_PARTY_NOTICES.md "$artifact/"
          cp -r LICENSES "$artifact/"
          cp docs/man/termshot.1 "$artifact/"
          cp -r docs "$artifact/"
          tar -czf "$artifact.tar.gz" "$artifact"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$artifact.tar.gz" > "$artifact.tar.gz.sha256"
          else
            shasum -a 256 "$artifact.tar.gz" > "$artifact.tar.gz.sha256"
          fi
          echo "ASSET=$artifact.tar.gz" >> "$GITHUB_ENV"
          echo "ASSET_SHA=$artifact.tar.gz.sha256" >> "$GITHUB_ENV"

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET_SHA }}

  # Native packages. `.deb` is built for both architectures; RPM is x86_64
  # only, because `cargo-generate-rpm` derives its dependencies by running the
  # host `ldd` against the binary, which cannot read a foreign-architecture
  # ELF: an aarch64 RPM would silently ship with no glibc requirement at all.
  packages:
    name: package (${{ matrix.kind }} ${{ matrix.arch }})
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: deb
            arch: amd64
            target: x86_64-unknown-linux-gnu
          - kind: deb
            arch: arm64
            target: aarch64-unknown-linux-gnu
            cross_gnu: true
          - kind: rpm
            arch: x86_64
            target: x86_64-unknown-linux-gnu

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.kind }}-${{ matrix.target }}

      - name: Install aarch64 cross toolchain
        if: matrix.cross_gnu
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Install cargo-deb
        if: matrix.kind == 'deb'
        run: cargo install cargo-deb --locked --version ^3.7

      - name: Install cargo-generate-rpm
        if: matrix.kind == 'rpm'
        run: cargo install cargo-generate-rpm --locked --version ^0.21

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build .deb
        if: matrix.kind == 'deb'
        shell: bash
        run: |
          set -euo pipefail
          # cargo-deb prints the path of the package it wrote, and rewrites the
          # `target/release/...` asset paths in Cargo.toml for the target.
          deb="$(cargo deb --no-build --target ${{ matrix.target }})"
          test -f "$deb"
          dpkg-deb --contents "$deb"
          depends="$(dpkg-deb --field "$deb" Depends)"
          test -n "$depends"
          echo "Depends: $depends"
          echo "ASSET=$deb" >> "$GITHUB_ENV"

      - name: Build RPM
        if: matrix.kind == 'rpm'
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-rpm --target ${{ matrix.target }}
          # With `--target`, cargo-generate-rpm writes to
          # target/<triple>/generate-rpm/<name>-<version>-<release>.<arch>.rpm
          shopt -s nullglob
          rpms=(target/${{ matrix.target }}/generate-rpm/*.rpm)
          if [ "${#rpms[@]}" -ne 1 ]; then
            echo "::error::expected exactly one RPM, found ${#rpms[@]}"
            exit 1
          fi
          echo "ASSET=${rpms[0]}" >> "$GITHUB_ENV"

      # Per-artifact checksum, computed in the same job that produced the
      # artifact, so there is no cross-job aggregation to go stale.
      - name: Checksum artifact
        shell: bash
        run: |
          set -euo pipefail
          dir="$(dirname "$ASSET")"
          base="$(basename "$ASSET")"
          ( cd "$dir" && sha256sum "$base" > "$base.sha256" )
          echo "ASSET_SHA=$ASSET.sha256" >> "$GITHUB_ENV"

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET_SHA }}

  # Future crate releases use crates.io trusted publishing. GitHub exchanges
  # its short-lived OIDC identity for a temporary crates.io token; no
  # long-lived registry token is stored in repository secrets.
  publish-crate:
    name: publish crates.io
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Verify tag matches crate version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "termshot") | .version')"
          test "${GITHUB_REF_NAME#v}" = "$version"

      - name: Verify publish package
        run: cargo publish --locked --dry-run

      - name: Authenticate to crates.io
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish crate
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
